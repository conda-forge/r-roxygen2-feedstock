{% set version = "8.0.0" %} 
{% set posix = 'm2-' if win else '' %}

package:
  name: r-roxygen2
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/roxygen2_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/roxygen2/roxygen2_{{ version }}.tar.gz
  sha256: 75816bf3a25554f5752254b985b7242490b0fabe68a5ada335c340b820ba34e8

build:
  number: 1
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
    - r-brew                       # [build_platform != target_platform]
    - r-commonmark                 # [build_platform != target_platform]
    - r-cpp11                      # [build_platform != target_platform]
    - r-desc >=1.2.0               # [build_platform != target_platform]
    - r-knitr                      # [build_platform != target_platform]
    - r-lifecycle                  # [build_platform != target_platform]
    - r-pkgload >=1.5.2            # [build_platform != target_platform]
    - r-r6 >=2.1.2                 # [build_platform != target_platform]
    - r-rlang >=1.1.0              # [build_platform != target_platform]
    - r-withr                      # [build_platform != target_platform]
    - r-xml2                       # [build_platform != target_platform]
    - {{ compiler('c') }}          # [not win]
    - {{ stdlib("c") }}            # [not win]
    - {{ compiler('m2w64_c') }}    # [win]
    - {{ stdlib("m2w64_c") }}      # [win]
    - {{ compiler('cxx') }}        # [not win]
    - {{ compiler('m2w64_cxx') }}  # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}make
    - {{ posix }}sed               # [win]
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
  host:
    - r-base
    - r-brew
    - r-commonmark
    - r-cpp11
    - r-desc >=1.2.0
    - r-knitr
    - r-lifecycle
    - r-pkgload >=1.5.2
    - r-r6 >=2.1.2
    - r-rlang >=1.1.0
    - r-withr
    - r-xml2
  run:
    - r-base
    - r-brew
    - r-commonmark
    - r-desc >=1.2.0
    - r-knitr
    - r-lifecycle
    - r-pkgload >=1.5.2
    - r-r6 >=2.1.2
    - r-rlang >=1.1.0
    - r-withr
    - r-xml2

test:
  commands:
    - $R -e "library('roxygen2')"           # [not win]
    - "\"%R%\" -e \"library('roxygen2')\""  # [win]

about:
  home: https://roxygen2.r-lib.org
  dev_url: https://github.com/r-lib/roxygen2
  doc_url: https://roxygen2.r-lib.org/reference/index.html
  license: MIT
  summary: Generate your Rd documentation, 'NAMESPACE' file, and collation  field using specially formatted comments. Writing documentation in-line with code makes it easier to keep your documentation up-to-date as your requirements change. 'Roxygen2' is inspired by the 'Doxygen' system for C++.
  license_family: MIT
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/MIT
    - LICENSE

extra:
  recipe-maintainers:
    - conda-forge/r
